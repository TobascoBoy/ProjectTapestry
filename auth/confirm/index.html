<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="dark" />
  <title>Confirm your email · Tapestry</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #fff;
      --muted: rgba(255,255,255,0.55);
      --faint: rgba(255,255,255,0.28);
      --hairline: rgba(255,255,255,0.14);
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 40px 24px calc(40px + env(safe-area-inset-bottom));
      text-align: center;
    }

    main { width: 100%; max-width: 340px; }

    .mark {
      width: 64px; height: 64px;
      margin: 0 auto 30px;
      border-radius: 50%;
      background: #141414;
      border: 1px solid var(--hairline);
      display: flex; align-items: center; justify-content: center;
    }
    .mark svg { width: 30px; height: 30px; }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.01em;
      margin-bottom: 12px;
    }

    p.sub {
      font-size: 15px;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .btn {
      display: block;
      width: 100%;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.01em;
      padding: 16px 24px;
      border: none;
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.82; }

    .secondary {
      margin-top: 22px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--faint);
    }
    .secondary button {
      background: none;
      border: none;
      padding: 0;
      font: inherit;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .wordmark {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom));
      left: 0; right: 0;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.18);
    }

    .spinner {
      width: 22px; height: 22px;
      border: 2px solid rgba(0,0,0,0.25);
      border-top-color: #000;
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="mark" id="mark">
      <!-- Envelope: the default, "we have a token, hand it to the app" state -->
      <svg id="icon-mail" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
        <path d="M3 7l9 6 9-6"/>
      </svg>
      <svg id="icon-check" viewBox="0 0 32 32" fill="none" hidden>
        <path d="M7 16.5L13 22.5L25 10" stroke="#fff" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 id="title">Confirm your email</h1>
    <p class="sub" id="subtitle">Open Tapestry to finish setting up your account.</p>

    <a class="btn" id="primary" href="#">Open Tapestry</a>

    <p class="secondary" id="secondary">
      Don't have Tapestry on this device?
      <button type="button" id="webConfirm">Confirm here instead</button>
    </p>
  </main>

  <p class="wordmark">TAPESTRY</p>

  <script>
    (function () {
      "use strict";

      // Publishable key — the same one shipped in the app binary. It grants
      // nothing on its own; the one-time token in the URL is the credential.
      var SUPABASE_URL = "https://jrdikjncaxdzxmxcddjv.supabase.co";
      var SUPABASE_KEY = "sb_publishable_I0bLlOuMPBw81zWPyI5RuQ_zM7WC1LN";

      var params    = new URLSearchParams(window.location.search);
      var tokenHash = params.get("token_hash");
      var type      = params.get("type") || "signup";

      var els = {
        title:     document.getElementById("title"),
        subtitle:  document.getElementById("subtitle"),
        primary:   document.getElementById("primary"),
        secondary: document.getElementById("secondary"),
        mail:      document.getElementById("icon-mail"),
        check:     document.getElementById("icon-check")
      };

      function showCheck() {
        els.mail.hidden = true;
        els.check.hidden = false;
      }

      // No token in the URL: usually a link that got truncated by a mail
      // client, or somebody landing here directly.
      if (!tokenHash) {
        els.title.textContent = "This link is incomplete";
        els.subtitle.textContent =
          "Some mail apps cut long links short. Open Tapestry and tap “Resend email” to get a fresh one.";
        els.primary.textContent = "Open Tapestry";
        els.primary.href = "tapestry://auth/callback";
        els.secondary.hidden = true;
        return;
      }

      // Happy path. The token is still unspent — hand it to the app, which
      // redeems it and gets a real session back, so the user lands signed in.
      //
      // Deliberately NOT auto-navigating: on a device without Tapestry
      // installed, a scripted jump to a custom scheme throws up a
      // "cannot open the page" alert. A button the user taps never does.
      var handoff = "tapestry://auth/verify?token_hash=" +
        encodeURIComponent(tokenHash) + "&type=" + encodeURIComponent(type);
      els.primary.href = handoff;

      // Browser fallback. This spends the token here rather than in the app,
      // so it is only ever reachable by an explicit tap — never automatically.
      document.getElementById("webConfirm").addEventListener("click", function () {
        els.primary.innerHTML = '<span class="spinner"></span>';
        els.primary.removeAttribute("href");
        els.secondary.hidden = true;

        fetch(SUPABASE_URL + "/auth/v1/verify", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },
          body: JSON.stringify({ type: type, token_hash: tokenHash })
        }).then(function (res) {
          if (!res.ok) throw new Error(String(res.status));
          showCheck();
          els.title.textContent = "Email confirmed";
          els.subtitle.textContent =
            "You're all set. Open Tapestry on your phone and log in.";
          els.primary.textContent = "Open Tapestry";
          els.primary.href = "tapestry://auth/callback";
        }).catch(function () {
          els.title.textContent = "That link has expired";
          els.subtitle.textContent =
            "Confirmation links are single-use. Open Tapestry and tap “Resend email” for a new one.";
          els.primary.textContent = "Open Tapestry";
          els.primary.href = "tapestry://auth/callback";
        });
      });
    })();
  </script>
</body>
</html>
