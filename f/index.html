<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="dark" />
  <title>You're invited · Tapestry</title>
  <!-- Static preview for iMessage / WhatsApp. The person's name is fetched on the page, never
       put in the URL, so the preview says the same thing for every invite. -->
  <meta property="og:title" content="Join me on Tapestry" />
  <meta property="og:description" content="Make a stack and curate a scrapbook together." />
  <meta property="og:image" content="https://jointhetapestry.com/og-icon.png" />
  <meta property="og:type" content="website" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #fff;
      --muted: rgba(255,255,255,0.55);
      --faint: rgba(255,255,255,0.28);
      --hairline: rgba(255,255,255,0.14);
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: 40px 24px calc(40px + env(safe-area-inset-bottom));
      text-align: center;
    }

    main { width: 100%; max-width: 340px; }

    /* A small pile of stickers: three offset cards. Generic on purpose — the page never shows
       a real picture (ONBOARDING_PLAN.md §5.2). */
    .pile {
      position: relative;
      width: 96px; height: 96px;
      margin: 0 auto 30px;
    }
    .pile span {
      position: absolute;
      inset: 10px;
      border-radius: 16px;
      background: #141414;
      border: 1px solid var(--hairline);
    }
    .pile span:nth-child(1) { transform: rotate(-9deg) translate(-6px, 4px); opacity: 0.6; }
    .pile span:nth-child(2) { transform: rotate(6deg) translate(5px, 2px); opacity: 0.8; }
    .pile span:nth-child(3) { background: #1c1c1c; }
    .pile .count {
      position: absolute;
      inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    p.sub {
      font-size: 15px;
      line-height: 1.55;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .btn {
      display: block;
      width: 100%;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      letter-spacing: 0.01em;
      padding: 16px 24px;
      border: none;
      border-radius: 14px;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.82; }

    .secondary {
      margin-top: 22px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--faint);
    }
    .secondary a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .note {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
    }
    .note strong { color: var(--ink); font-weight: 600; }

    /* The looped-thread logo (the app's own mark; the "TAPESTRY" wordmark is being phased out,
       2026-11-03). Black on transparent in the file, inverted for the black page. */
    .logomark {
      position: fixed;
      bottom: calc(28px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      height: 20px;
      width: auto;
      filter: invert(1);
      opacity: 0.28;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="pile" aria-hidden="true">
      <span></span><span></span><span></span>
      <div class="count" id="count"></div>
    </div>

    <h1 id="title">Opening your invite…</h1>
    <p class="sub" id="subtitle">One moment.</p>

    <a class="btn" id="primary" href="https://testflight.apple.com/join/SzCFn81z" hidden>Get Tapestry</a>

    <p class="note" id="note" hidden>
      <strong>Then come back and tap this link again</strong> once Tapestry is installed —
      that’s what lands you in your chat with everything waiting.
    </p>

    <p class="secondary" id="secondary" hidden>
      Already have Tapestry? <a id="openApp" href="#">Open your invite in the app</a>
    </p>
  </main>

  <img class="logomark" src="/logo-mark.png" alt="Tapestry">

  <script>
    (function () {
      "use strict";

      // Publishable key — the same one shipped in the app binary. It grants nothing on its own;
      // `invite_preview` is the ONE thing an anonymous caller may ask, and it answers with a first
      // name and a count, never a picture (ONBOARDING_PLAN.md §5.2).
      var SUPABASE_URL = "https://jrdikjncaxdzxmxcddjv.supabase.co";
      var SUPABASE_KEY = "sb_publishable_I0bLlOuMPBw81zWPyI5RuQ_zM7WC1LN";
      var STORE_URL    = "https://testflight.apple.com/join/SzCFn81z";

      var els = {
        title:     document.getElementById("title"),
        subtitle:  document.getElementById("subtitle"),
        primary:   document.getElementById("primary"),
        secondary: document.getElementById("secondary"),
        openApp:   document.getElementById("openApp"),
        note:      document.getElementById("note"),
        count:     document.getElementById("count")
      };

      // /f/<CODE> — the code is the link's token. Upper-cased; the same alphabet the app accepts.
      var parts = window.location.pathname.split("/").filter(Boolean);
      var code = (parts[0] === "f" && parts[1]) ? parts[1].toUpperCase().replace(/[^A-Z2-9]/g, "") : "";
      var looksLikeCode = code.length === 6;

      function show(title, subtitle) {
        els.title.textContent = title;
        els.subtitle.textContent = subtitle;
        els.primary.hidden = false;
      }

      function offerApp() {
        // Deliberately NOT auto-navigating to the custom scheme: on a phone without Tapestry a
        // scripted jump throws up "cannot open the page". A tap never does. With Tapestry
        // installed, iOS normally opens the link straight into the app and this page is never
        // seen; this is the road back for a tap that landed in a browser anyway.
        els.openApp.href = "tapestry://f/" + code;
        els.secondary.hidden = false;
        els.note.hidden = false;
      }

      if (!looksLikeCode) {
        show("This invite link isn’t complete",
             "Some apps cut long links short. Ask your friend to send it again.");
        return;
      }

      fetch(SUPABASE_URL + "/rest/v1/rpc/invite_preview", {
        method: "POST",
        headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY },
        body: JSON.stringify({ p_code: code })
      }).then(function (res) {
        if (res.status === 429) throw new Error("throttled");
        if (!res.ok) throw new Error(String(res.status));
        return res.json();
      }).then(function (rows) {
        var row = Array.isArray(rows) ? rows[0] : null;
        if (!row) {
          show("This invite isn’t valid any more",
               "It may have been used already. Ask your friend for a new one.");
          return;
        }
        var name = row.inviter_name || "Someone";
        var n = row.sticker_count || 0;
        if (row.expired) {
          show("This invite has expired", "Ask " + name + " to send you a new one.");
          return;
        }
        if (n > 0) els.count.textContent = String(n);
        show(name + " wants to make a stack and curate a scrapbook with you on Tapestry.",
             n === 0 ? "A chat is waiting for you."
             : n === 1 ? "1 sticker is already waiting for you."
             : n + " stickers are already waiting for you.");
        offerApp();
      }).catch(function (err) {
        if (err && err.message === "throttled") {
          show("Too many tries just now", "Wait a minute and open the link again.");
        } else {
          show("Couldn’t open this invite", "Check your connection and try the link again.");
        }
      });

      els.primary.href = STORE_URL;
    })();
  </script>
</body>
</html>
